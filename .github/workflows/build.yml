name: build

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Build
        run: dotnet build source/ExifGlass.slnx -c Debug -p:Platform=x64

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: source/scripts/test.ps1

      - name: Test (macOS, Linux)
        if: runner.os != 'Windows'
        run: bash source/scripts/test.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: source/__artifacts/reports
          if-no-files-found: ignore
